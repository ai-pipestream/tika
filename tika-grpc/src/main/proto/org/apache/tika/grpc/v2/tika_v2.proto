// Experimental v2 parse surface. Fetcher/iterator management stays on the
// existing `tika.Tika` (v1) service; this service returns the typed Document
// contract instead of the legacy fields map. Additive follow-ups (ParseBytes,
// content tree, embedded recursion) extend this package.

syntax = "proto3";

package org.apache.tika.grpc.v2;

import "org/apache/tika/grpc/v2/document.proto";

option java_multiple_files = true;
option java_package = "org.apache.tika.grpc.v2";
option java_outer_classname = "TikaV2Proto";

service TikaV2 {
  // Fetch via a previously saved fetcher and return a typed Document.
  rpc FetchAndParse(FetchAndParseRequest) returns (FetchAndParseReply) {}
  rpc FetchAndParseServerSideStreaming(FetchAndParseRequest)
      returns (stream FetchAndParseReply) {}
  rpc FetchAndParseBiDirectionalStreaming(stream FetchAndParseRequest)
      returns (stream FetchAndParseReply) {}

  // Parse-only entrypoint (TIKA-4795 PoC): parse the exact bytes the caller already
  // holds. No fetcher registration. Reply is the same Document contract; ParseBytes
  // provenance is also packed into Document.extensions as ParseBytesContext.
  rpc ParseBytes(ParseBytesRequest) returns (ParseBytesReply) {}
}

message FetchAndParseRequest {
  // ID of a fetcher previously saved through the v1 Tika service.
  string fetcher_id = 1;
  string fetch_key = 2;
  string additional_fetch_config_json = 3;
  string emitter_id = 4;
  // Optional JSON object to configure the ParseContext for this request.
  string parse_context_json = 5;
}

message FetchAndParseReply {
  string fetch_key = 1;
  Document document = 2;
}

message ParseBytesRequest {
  // Opaque caller correlation id. Echoed as Document.id and ParseBytesReply.correlation_id
  // when set; never interpreted by the service.
  string correlation_id = 1;
  // Exact bytes to parse. Required; must be non-empty and within the server bound.
  bytes content = 2;
  // Optional resource name (e.g. "page.html") used as a detection/name hint.
  string resource_name = 3;
  // Provenance: never dereferenced by the service.
  string source_uri = 4;
  string effective_uri = 5;
  string base_uri = 6;
  // Declared media type / charset hints from the acquisition path.
  string declared_content_type = 7;
  string declared_charset = 8;
  // Optional caller-declared length / digest for later validation experiments.
  int64 declared_content_length = 9;
  string declared_sha256 = 10;
  bool truncated = 11;
  // Optional JSON object to configure the ParseContext for this request.
  string parse_context_json = 12;
}

message ParseBytesReply {
  string correlation_id = 1;
  Document document = 2;
}
