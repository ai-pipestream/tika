syntax = "proto3";

package org.apache.tika.grpc.messages.v2alpha1;

import "google/protobuf/any.proto";
import "google/protobuf/struct.proto";

option java_multiple_files = true;
option java_package = "org.apache.tika.grpc.messages.v2alpha1";
option java_outer_classname = "MessageParserServiceProto";

// Parses protobuf messages the client already has. Each message is handled by the
// MessageParser<T extends Message> a plugin jar installed for its type, and comes back as the
// list of ParsedDocuments: the shape /rmeta returns.
service MessageParserService {
  // NOT_FOUND when no parser handles the message's type.
  rpc ParseMessage(ParseMessageRequest) returns (ParseMessageResponse);
  // One document per message, in the order of ParseMessageResponse.documents.
  rpc ParseMessageStream(ParseMessageStreamRequest) returns (stream ParseMessageStreamResponse);
  // One response per request. A request that fails gets a response with `error` set; the
  // stream continues. Match responses to requests by request_id.
  rpc ParseMessageBidi(stream ParseMessageBidiRequest) returns (stream ParseMessageBidiResponse);
}

message ParseMessageRequest {
  // The message to parse. Its type URL picks the parser.
  google.protobuf.Any message = 1;
}

message ParseMessageStreamRequest {
  google.protobuf.Any message = 1;
}

message ParseMessageBidiRequest {
  google.protobuf.Any message = 1;
  // Chosen by the client and echoed in the response.
  string request_id = 2;
}

message ParseMessageResponse {
  // [0] is the container; embedded documents follow in the order the parser returned them.
  repeated ParsedDocument documents = 1;
}

message ParseMessageStreamResponse {
  ParsedDocument document = 1;
}

message ParseMessageBidiResponse {
  string request_id = 1;
  // Set when the request failed.
  RequestError error = 2;
  // Set otherwise.
  ParseMessageResponse result = 3;
}

message RequestError {
  // The gRPC status code a unary call would have closed with (3 INVALID_ARGUMENT, 5 NOT_FOUND,
  // 13 INTERNAL).
  int32 code = 1;
  string message = 2;
}

message ParsedDocument {
  // Empty for the container; otherwise the document's tk:embedded-id-path.
  string embedded_path = 1;
  // The extracted text, if the parser produced any. Not repeated in metadata.
  string content = 2;
  // Every metadata key. A key declared BOOLEAN, INTEGER or REAL is a bool or number; a JSON key
  // holding one object or array is that JSON; a key with more than one value, or declared
  // multi-valued (BAG, SEQ, ALT), is a list. Everything else, and any value that does not fit
  // its type or is an integer beyond 2^53, is Tika's string. Types come from Tika's metadata
  // key registry, then from the parser's own properties().
  google.protobuf.Struct metadata = 3;
}
