// Proposed "Document" shape for Tika gRPC (design draft for the new-shape PR).
//
// Content model = a structured markdown document tree (blocks + inline runs, with
// tables / task lists / strikethrough / alerts). It is anchored to a stable, standard
// markdown shape, so it does not churn, it renders straight back to markdown, and every
// RAG/LLM tool already speaks it. Reusable in OpenNLP.
//
// Metadata = typed common fields (by concern) + a TAGGED tail. Tags come from Tika's
// declared Property value type; unknown keys are strings, never guessed.
//
// Format specifics arrive via per-parser DocumentTransformer code - no proto-per-type,
// so adding a parser never touches the wire.

syntax = "proto3";

package org.apache.tika.grpc.v1; // or a neutral shared package so OpenNLP imports the same Document

import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_package = "org.apache.tika.grpc.v1";

// =========================================================================
// Top level
// =========================================================================
message Document {
  // envelope
  string id = 1;
  string source_format = 2;            // detected category: "pdf","docx","jpeg",...
  string content_type = 3;             // Tika MIME
  google.protobuf.Timestamp parsed_at = 4;
  ParseStatus status = 5;
  SourceOrigin origin = 6;

  // content (structured markdown tree). `markdown` is an optional convenience render of `blocks`.
  repeated Block blocks = 10;
  string markdown = 11;

  // metadata
  DocumentMetadata metadata = 20;      // typed common fields
  repeated MetadataField extra = 21;   // tagged tail

  // embedded children, recursive (parent PDF + child image, each fully typed)
  repeated Document embedded = 30;
}

message SourceOrigin {
  string filename = 1;
  string uri = 2;
  int64 byte_size = 3;
  string parser = 4;
}

// Provenance back into the extracted text (optional; powers RAG citation/highlight).
message SourceSpan { int32 start = 1; int32 length = 2; int32 line = 3; }

// =========================================================================
// Blocks (markdown block structure)
// =========================================================================
message Block {
  SourceSpan span = 1;                 // optional provenance
  oneof block {
    Heading heading = 2;               // ATX/setext, level 1..6
    Paragraph paragraph = 3;
    BlockQuote block_quote = 4;
    BulletList bullet_list = 5;
    OrderedList ordered_list = 6;
    CodeBlock code_block = 7;          // fenced or indented
    HtmlBlock html_block = 8;
    ThematicBreak thematic_break = 9;
    Table table = 10;                  // GFM
    Alert alert = 11;                  // GFM alert / admonition
  }
}

message Heading { int32 level = 1; repeated Inline content = 2; }
message Paragraph { repeated Inline content = 1; }
message BlockQuote { repeated Block blocks = 1; }
message ThematicBreak {}
message HtmlBlock { string literal = 1; }

message BulletList { string marker = 1; bool tight = 2; repeated ListItem items = 3; }      // marker: - + *
message OrderedList { int32 start = 1; string delimiter = 2; bool tight = 3; repeated ListItem items = 4; } // delimiter: . )
message ListItem {
  TaskStatus task = 1;                 // GFM task list checkbox
  repeated Block blocks = 2;
}
enum TaskStatus { TASK_NONE = 0; TASK_UNCHECKED = 1; TASK_CHECKED = 2; }

message CodeBlock { bool fenced = 1; string info = 2; string literal = 3; }  // info = fence language/info

message Table { repeated TableCell header = 1; repeated TableRow rows = 2; }
message TableRow { repeated TableCell cells = 1; }
message TableCell { Alignment alignment = 1; repeated Inline content = 2; }
enum Alignment { ALIGN_NONE = 0; ALIGN_LEFT = 1; ALIGN_CENTER = 2; ALIGN_RIGHT = 3; }

message Alert { string type = 1; repeated Block blocks = 2; }  // NOTE / TIP / WARNING / ...

// =========================================================================
// Inline runs (structured markdown formatting)
// =========================================================================
message Inline {
  oneof inline {
    string text = 1;                   // plain run
    Emphasis emphasis = 2;             // *italic*
    Strong strong = 3;                 // **bold**
    Strikethrough strikethrough = 4;   // ~~del~~ (GFM)
    Code code = 5;                     // `code`
    Link link = 6;
    Image image = 7;
    string html = 8;                   // raw inline html
    LineBreak line_break = 9;
  }
}
message Emphasis { repeated Inline content = 1; }
message Strong { repeated Inline content = 1; }
message Strikethrough { repeated Inline content = 1; }
message Code { string literal = 1; }
message Link { string destination = 1; string title = 2; repeated Inline content = 3; }
message LineBreak { bool hard = 1; }

// Image as a markdown inline, extended for Tika: embedded bytes + optional chart data.
message Image {
  string destination = 1;
  string title = 2;
  string alt = 3;
  bytes data = 4;                      // inline binary, when Tika has the bytes
  string media_type = 5;               // e.g. image/png
  Chart chart = 6;                     // optional extracted chart data
}
message Chart {
  string kind = 1;                     // bar|line|pie|scatter|...
  string title = 2;
  repeated ChartSeries series = 3;
}
message ChartSeries { string name = 1; repeated double values = 2; repeated string labels = 3; }

// =========================================================================
// Metadata: typed common fields (grouped by concern, not by source format)
// =========================================================================
message DocumentMetadata {
  string title = 1;
  string subtitle = 2;
  repeated string authors = 3;
  repeated string creators = 4;
  string description = 5;
  repeated string keywords = 6;
  repeated string languages = 7;

  google.protobuf.Timestamp created = 10;
  google.protobuf.Timestamp modified = 11;
  google.protobuf.Timestamp published = 12;

  int32 page_count = 20;
  int64 word_count = 21;
  int64 character_count = 22;

  string rights = 30;
  string license_url = 31;

  int32 width = 40;
  int32 height = 41;
  double duration_seconds = 42;

  // ... extend by concern (security, geo, email headers, fonts). This is where
  // the "few hundred fields" live - bounded, common, and cross-format.
}

// =========================================================================
// Tagged tail: typed where Tika declares the type, string otherwise (never guessed)
// =========================================================================
message MetadataField { string key = 1; MetadataValue value = 2; }
message MetadataValue {
  oneof value {
    StringList strings = 1;            // default for untyped / multivalue text
    int64 integer = 2;
    double number = 3;
    bool boolean = 4;
    google.protobuf.Timestamp timestamp = 5;
  }
}
message StringList { repeated string values = 1; }

message ParseStatus {
  enum Status { UNSPECIFIED = 0; SUCCESS = 1; PARTIAL = 2; FAILED = 3; }
  Status status = 1;
  int64 parse_time_ms = 2;
  repeated string warnings = 3;
  repeated string errors = 4;
}
